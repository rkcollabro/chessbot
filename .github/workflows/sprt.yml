# Sequential test (SPRT) of candidate vs base, run in rounds across parallel runners. Each round plays
# JOBS x PAIRS game pairs (each opening with both colors), adds them to the previous rounds' games, and stops
# once the result is statistically clear: PASSED (candidate is at least about elo1 stronger), FAILED (it is not
# better than elo0). Otherwise the round dispatches the next one, up to max_rounds.
# Each revision is built from its own source and plays with the nnue.bin committed in that revision.
name: SPRT
run-name: SPRT ${{ inputs.candidate }}${{ inputs.candidate_options && format(' [{0}]', inputs.candidate_options) || '' }} vs ${{ inputs.base }}${{ inputs.base_options && format(' [{0}]', inputs.base_options) || '' }}${{ inputs.book && inputs.book != 'none' && format(' (book {0})', inputs.book) || '' }} (round ${{ inputs.round }})

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate git ref (branch, tag or commit)
        required: true
      base:
        description: Base git ref
        required: true
        default: master
      tc:
        description: Time control, seconds+increment
        default: "10+0.1"
      elo0:
        description: SPRT lower bound (Elo)
        default: "0"
      elo1:
        description: SPRT upper bound (Elo)
        default: "10"
      max_rounds:
        description: Give up as inconclusive after this many rounds (2000 games each)
        default: "5"
      candidate_flags:
        description: Extra compiler flags for the candidate (e.g. -DNNUE_HIDDEN_SIZE=512)
        default: ""
      base_flags:
        description: Extra compiler flags for the base
        default: ""
      candidate_options:
        description: 'Candidate UCI options and play settings, e.g. "Threads=4 ponder=1 overhead=1000" (overhead in ms)'
        default: ""
      base_options:
        description: Base UCI options and play settings
        default: ""
      concurrency:
        description: Games played at once per runner (4 CPUs; use 1 when an engine runs several threads or ponders)
        default: "4"
      book:
        description: Side that plays from its opening book (games then start from the initial position)
        type: choice
        options: [none, cand, base, both]
        default: none
      round:
        description: Round number (set by the previous round; leave at 1)
        default: "1"
      prev_run:
        description: Run id of the previous round (set by the previous round; leave empty)
        default: ""

permissions:
  actions: write
  contents: read

env:
  JOBS: 20
  PAIRS: 50  # per job and round: 20 x 50 pairs = 2000 games a round

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore tablebases
        id: tb
        uses: actions/cache@v4
        with:
          path: tb
          key: tb-v1
      - name: Generate tablebases
        if: steps.tb.outputs.cache-hit != 'true'
        run: sh tools/ci_build.sh src chesscli && ./chesscli tbgen
      - name: Plan shards
        id: plan
        run: echo "shards=$(python3 -c "print(list(range($JOBS)))")" >> "$GITHUB_OUTPUT"

  shard:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: tb
          key: tb-v1
          fail-on-cache-miss: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install chess==1.11.2
      - name: Build both engines
        env:
          CAND_REF: ${{ inputs.candidate }}
          BASE_REF: ${{ inputs.base }}
          CAND_FLAGS: ${{ inputs.candidate_flags }}
          BASE_FLAGS: ${{ inputs.base_flags }}
        run: |
          for side in cand base; do
            if [ $side = cand ]; then ref=$CAND_REF; flags=$CAND_FLAGS; else ref=$BASE_REF; flags=$BASE_FLAGS; fi
            mkdir -p "eng/$side"
            case $ref in stockfish:*)
              # An official Stockfish release as the opponent, e.g. "stockfish:17.1" (limit it with base_options
              # such as "UCI_LimitStrength=true UCI_Elo=2800").
              curl -sSfL -o /tmp/sf.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_${ref#stockfish:}/stockfish-ubuntu-x86-64-avx2.tar"
              mkdir -p /tmp/sf && tar -xf /tmp/sf.tar -C /tmp/sf
              cp "$(find /tmp/sf -type f -name 'stockfish-ubuntu-x86-64-avx2' | head -1)" "eng/$side/stockfish"
              chmod +x "eng/$side/stockfish"
              echo "uci" | "eng/$side/stockfish" | grep -m1 "^id name"
              continue;;
            esac
            git worktree add "/tmp/$side" "origin/$ref" 2>/dev/null || git worktree add "/tmp/$side" "$ref"
            sh tools/ci_build.sh "/tmp/$side/src" "eng/$side/chesscli" $flags
            [ -f "/tmp/$side/nnue.bin" ] && cp "/tmp/$side/nnue.bin" "eng/$side/"
            [ -f "/tmp/$side/book.bin" ] && cp "/tmp/$side/book.bin" "eng/$side/"
            ln -s "$PWD/tb" "eng/$side/tb"
          done
      - name: Play
        env:
          TC: ${{ inputs.tc }}
          ROUND: ${{ inputs.round }}
          CAND_OPTS: ${{ inputs.candidate_options }}
          BASE_OPTS: ${{ inputs.base_options }}
          CONC: ${{ inputs.concurrency || '4' }}
        run: |
          # Every round and shard starts at its own opening, so later rounds move on through the book.
          offset=$(( ((ROUND - 1) * JOBS * PAIRS + ${{ matrix.shard }} * PAIRS) % 3000 ))
          bin() { if [ -f "eng/$1/stockfish" ]; then echo "eng/$1/stockfish"; else echo "eng/$1/chesscli"; fi; }
          python3 tools/sprt.py "$(bin cand)" "$(bin base)" --fixed "$PAIRS" --offset "$offset" \
            --tc "$TC" --concurrency "$CONC" --book "${{ inputs.book || 'none' }}" --json "result-${{ matrix.shard }}.json"             --cand-options "$CAND_OPTS" --base-options "$BASE_OPTS"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.shard }}
          path: result-${{ matrix.shard }}.json
          retention-days: 30

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
      - name: Previous rounds
        if: inputs.prev_run != ''
        uses: actions/download-artifact@v4
        with:
          name: sprt-total
          run-id: ${{ inputs.prev_run }}
          github-token: ${{ github.token }}
          path: results/prev
      - name: Summary
        id: sum
        env:
          TITLE: ${{ inputs.candidate }} vs ${{ inputs.base }} at ${{ inputs.tc }}, after round ${{ inputs.round }}
        run: |
          files=$(ls results/*.json results/prev/*.json 2>/dev/null || true)  # prev: earlier rounds' total
          python3 tools/combine.py $files --sprt ${{ inputs.elo0 }} ${{ inputs.elo1 }} \
            --title "$TITLE" --out sprt-total.json | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$(sed -n 's/^RESULT \([A-Z]*\).*/\1/p' summary.md)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sprt-total
          path: sprt-total.json
          retention-days: 30
      - name: Next round
        if: steps.sum.outputs.verdict == 'INCONCLUSIVE' && fromJson(inputs.round) < fromJson(inputs.max_rounds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sprt.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f candidate="${{ inputs.candidate }}" -f base="${{ inputs.base }}" -f tc="${{ inputs.tc }}" \
            -f elo0="${{ inputs.elo0 }}" -f elo1="${{ inputs.elo1 }}" -f max_rounds="${{ inputs.max_rounds }}" \
            -f candidate_flags="${{ inputs.candidate_flags }}" -f base_flags="${{ inputs.base_flags }}" \
            -f book="${{ inputs.book || 'none' }}" -f candidate_options="${{ inputs.candidate_options }}"             -f base_options="${{ inputs.base_options }}" -f concurrency="${{ inputs.concurrency || '4' }}" -f round="$(( ${{ inputs.round }} + 1 ))" -f prev_run="${{ github.run_id }}"
          echo "Round $(( ${{ inputs.round }} + 1 )) dispatched." >> "$GITHUB_STEP_SUMMARY"
